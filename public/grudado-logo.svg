<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240" fill="none">
  <defs>
    <linearGradient id="squareGrad" x1="20" y1="20" x2="105" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05C3DE" />
      <stop offset="60%" stop-color="#25BFCC" />
      <stop offset="100%" stop-color="#8EDD65" />
    </linearGradient>
    <linearGradient id="triGrad" x1="180" y1="15" x2="180" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF426F" />
      <stop offset="35%" stop-color="#FF6A39" />
      <stop offset="100%" stop-color="#F9E547" />
    </linearGradient>
  </defs>

  <!-- Mascot 1: Square (Cyan/Green) -->
  <g id="mascot-square">
    <rect x="20" y="20" width="94" height="94" rx="18" fill="url(#squareGrad)" stroke="#253746" stroke-width="7" />
    <circle cx="40" cy="76" r="11" fill="#F9E547" opacity="0.9" />
    <circle cx="92" cy="85" r="12" fill="#05C3DE" opacity="0.8" />
    <circle cx="54" cy="98" r="7" fill="#8EDD65" opacity="0.9" />

    <!-- Eyes -->
    <circle cx="50" cy="52" r="11" fill="#FFFFFF" stroke="#253746" stroke-width="4.5" />
    <circle cx="54" cy="49" r="5" fill="#253746" />
    <circle cx="56" cy="47" r="1.8" fill="#FFFFFF" />

    <circle cx="82" cy="52" r="11" fill="#FFFFFF" stroke="#253746" stroke-width="4.5" />
    <circle cx="86" cy="49" r="5" fill="#253746" />
    <circle cx="88" cy="47" r="1.8" fill="#FFFFFF" />

    <!-- Nose -->
    <path d="M66 65V76" stroke="#253746" stroke-width="4.5" stroke-linecap="round" />

    <!-- Smile -->
    <path d="M49 84C49 84 56 93 66 93C76 93 83 84 83 84" fill="#FFFFFF" stroke="#253746" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Mascot 2: Triangle (Pink/Orange) -->
  <g id="mascot-triangle">
    <path d="M198 16C202 9 210 9 214 16L254 86C258 94 253 104 243 104H169C159 104 154 94 158 86L198 16Z" fill="url(#triGrad)" stroke="#253746" stroke-width="7" stroke-linejoin="round" />
    <circle cx="178" cy="88" r="9" fill="#F9E547" opacity="0.95" />
    <circle cx="232" cy="88" r="9" fill="#F9E547" opacity="0.95" />

    <!-- Glasses -->
    <circle cx="186" cy="50" r="16" fill="#FFFFFF" stroke="#05C3DE" stroke-width="6.5" />
    <circle cx="186" cy="50" r="16" fill="none" stroke="#253746" stroke-width="2.5" />
    <circle cx="186" cy="50" r="4.5" fill="#253746" />
    <circle cx="188" cy="48" r="1.6" fill="#FFFFFF" />

    <circle cx="226" cy="50" r="16" fill="#FFFFFF" stroke="#05C3DE" stroke-width="6.5" />
    <circle cx="226" cy="50" r="16" fill="none" stroke="#253746" stroke-width="2.5" />
    <circle cx="226" cy="50" r="4.5" fill="#253746" />
    <circle cx="228" cy="48" r="1.6" fill="#FFFFFF" />

    <path d="M202 50H210" stroke="#05C3DE" stroke-width="6.5" stroke-linecap="round" />
    <path d="M202 50H210" stroke="#253746" stroke-width="2.5" stroke-linecap="round" />

    <!-- Smile -->
    <path d="M194 76C194 76 200 84 206 84C212 84 218 76 218 76" fill="#FFFFFF" stroke="#253746" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="140" y="168" text-anchor="middle" fill="#253746" font-family="'Comfortaa', 'Nunito', 'Quicksand', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-1.5">grudado</text>
  <text x="135" y="212" text-anchor="middle" fill="#253746" font-family="'Comfortaa', 'Nunito', 'Quicksand', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-1.5">em você</text>
  <text x="238" y="196" fill="#253746" font-family="'Comfortaa', 'Nunito', 'Quicksand', system-ui, sans-serif" font-weight="700" font-size="14">®</text>
</svg>
